[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D105", "D106", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "D"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
