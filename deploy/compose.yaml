name: videoflix
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate a private Django secret}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
    # Loopback HTTP acceptance only. Production requires an HTTPS proxy.
    SECURE_SSL_REDIRECT: "false"
    COOKIE_SECURE: "false"
    POSTGRES_HOST: db
    POSTGRES_DB: ${POSTGRES_DB:-videoflix}
    POSTGRES_USER: ${POSTGRES_USER:-videoflix}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    REDIS_URL: redis://redis:6379/0?socket_connect_timeout=2&socket_timeout=10
    FRONTEND_URL: http://127.0.0.1:5500
    EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
    EMAIL_FILE_PATH: /app/test-mail
  volumes:
    - media:/app/media
    - private_media:/app/private_media
    - static:/app/staticfiles
    - test_mail:/app/test-mail
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  init: true
  restart: unless-stopped
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videoflix}
      POSTGRES_USER: ${POSTGRES_USER:-videoflix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    restart: "no"
  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/csrf/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker-default:
    <<: *app
    command: [python, manage.py, rqworker, default, --with-scheduler]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker-video:
    <<: *app
    command: [python, manage.py, rqworker, video, --with-scheduler]
    depends_on:
      migrate:
        condition: service_completed_successfully
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/csrf/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  redis:
  media:
  private_media:
  static:
  test_mail:
