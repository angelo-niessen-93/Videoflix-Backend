server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 2g;
    location /static/ { alias /srv/static/; }
    location /media/ { alias /srv/media/; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
}
